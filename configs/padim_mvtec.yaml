seed: 42

dataset:
  root: datasets/mvtec
  category: bottle
  image_size: 256

model:
  name: padim
  backbone: resnet18
  pre_trained: true
  n_features: 64
  layers:
    - layer2

trainer:
  device: cpu
  batch_size: 8

thresholds:
  calibration_fraction: 0.2
  image_quantile: 0.995
  pixel_quantile: 0.999

postprocess:
  min_area: 50
  morph_kernel: 3

outputs:
  run_root: runs/padim
consistency:
  max_abs_error: 0.0001
  mean_abs_error: 0.00001
