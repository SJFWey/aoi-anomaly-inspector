[project]
name = "aoi-anomaly-inspector"
version = "0.1.0"
description = "Industrial AOI anomaly detection pipeline practice project"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.7.1",
    "opencv-python>=4.13.0.90",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
